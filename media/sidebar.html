<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <meta
        http-equiv="Content-Security-Policy"
        content="
            default-src 'none';
            style-src 'self' 'unsafe-inline';
            script-src 'nonce-__NONCE__';
        "
    >

    <link
        rel="stylesheet"
        href="__STYLE_URI__"
    >

    <title>Coyote 2.0</title>
</head>

<body>

    <section class="header">
        <div>
            <h2>Coyote 2.0</h2>
            <span id="state">未连接</span>
        </div>

        <div id="battery">
            --%
        </div>
    </section>

    <section class="card">

        <div class="section-title">
            设备
        </div>

        <div id="device">
            未连接设备
        </div>

        <div class="buttons">
            <button id="connect">
                连接
            </button>

            <button
                id="disconnect"
                disabled
            >
                断开
            </button>
        </div>

    </section>

    <section class="card">

        <div class="section-title">
            A / B 强度
        </div>

        <div class="row">
            <label>
                A
                <input
                    id="intensityA"
                    type="number"
                    min="0"
                    max="200"
                    value="0"
                >
            </label>

            <label>
                B
                <input
                    id="intensityB"
                    type="number"
                    min="0"
                    max="200"
                    value="0"
                >
            </label>
        </div>

        <div class="buttons">
            <button id="setIntensity">
                写入 1504
            </button>

            <button id="readIntensity">
                读取
            </button>
        </div>

        <div class="raw">
            Raw:
            <span id="intensityRaw">
                --
            </span>
        </div>

    </section>

    <section class="card">

        <div class="section-title">
            A 通道波形
        </div>

        <div class="row">
            <label>
                X
                <input
                    id="ax"
                    type="number"
                    min="0"
                    max="31"
                    value="0"
                >
            </label>

            <label>
                Y
                <input
                    id="ay"
                    type="number"
                    min="0"
                    max="1023"
                    value="0"
                >
            </label>

            <label>
                Z
                <input
                    id="az"
                    type="number"
                    min="0"
                    max="31"
                    value="0"
                >
            </label>
        </div>

        <div class="buttons">
            <button
                data-wave-write="A"
            >
                写入 A
            </button>

            <button
                data-wave-read="A"
            >
                读取 A
            </button>
        </div>

    </section>

    <section class="card">

        <div class="section-title">
            B 通道波形
        </div>

        <div class="row">
            <label>
                X
                <input
                    id="bx"
                    type="number"
                    min="0"
                    max="31"
                    value="0"
                >
            </label>

            <label>
                Y
                <input
                    id="by"
                    type="number"
                    min="0"
                    max="1023"
                    value="0"
                >
            </label>

            <label>
                Z
                <input
                    id="bz"
                    type="number"
                    min="0"
                    max="31"
                    value="0"
                >
            </label>
        </div>

        <div class="buttons">
            <button
                data-wave-write="B"
            >
                写入 B
            </button>

            <button
                data-wave-read="B"
            >
                读取 B
            </button>
        </div>

    </section>

    <section class="card">

        <div class="section-title">
            控制
        </div>

        <button
            id="arm"
            class="secondary"
        >
            解除急停
        </button>

        <button
            id="emergencyStop"
            class="danger"
        >
            ■ 紧急停止
        </button>

    </section>

    <section class="card">

        <div class="section-title">
            日志
        </div>

        <pre id="log"></pre>

    </section>

    <script
        nonce="__NONCE__"
        src="__SCRIPT_URI__"
    ></script>

</body>
</html>
